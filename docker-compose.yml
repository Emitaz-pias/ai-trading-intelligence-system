services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8

  analysis:
    build:
      context: .
      dockerfile: services/analysis/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost}
      MONGO_URI: ${COMPOSE_MONGO_URI:-mongodb://mongo:27017/ai_trading_intelligence}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      DATA_MODE: ${DATA_MODE:-disabled}
      MARKET_SYMBOL: ${MARKET_SYMBOL:-XAUUSD}
      MAX_TICK_AGE_SECONDS: ${MAX_TICK_AGE_SECONDS:-30}
      MARKET_DATA_RETENTION_DAYS: ${MARKET_DATA_RETENTION_DAYS:-1825}
      ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-1095}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-2555}
      ANALYSIS_URL: http://analysis:8001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    depends_on:
      mongo:
        condition: service_healthy
      analysis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
